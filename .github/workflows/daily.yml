name: Daily Trending Repos

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:  # 支持手动触发(会跳过节假日判断)

jobs:
  trending:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run trending script
        run: npm run server
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          BAIDU_APP_ID: ${{ secrets.BAIDU_APP_ID }}
          BAIDU_SECRET_KEY: ${{ secrets.BAIDU_SECRET_KEY }}
          SKIP_HOLIDAYS: ${{ secrets.SKIP_HOLIDAYS }}

      - name: Notify failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          BODY="{\"msgtype\":\"text\",\"text\":{\"content\":\"❌ ${GITHUB_WORKFLOW} 推送失败，详情: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}}"
          curl -sS -X POST "$WEBHOOK_URL" -H 'Content-Type: application/json' -d "$BODY"
